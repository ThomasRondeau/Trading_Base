[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etudes-strategies"
version = "0.1.0"
description = "Outil de recherche de stratégies de trading basées sur le machine learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "xgboost>=3.0",
    "statsmodels>=0.14",
    "matplotlib>=3.10",
    "mplfinance>=0.12.10b0",
    "yfinance>=1.2",
    "requests>=2.31",
    "ibapi>=10.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["Connections*", "Engines*", "Features*", "Models*", "Strategies*", "Targets*", "Types*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
