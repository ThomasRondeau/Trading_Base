[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etudes-strategies"
version = "0.1.0"
description = "Outil de recherche de stratégies de trading basées sur le machine learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "xgboost>=3.0",
    "statsmodels>=0.14",
    "matplotlib>=3.10",
    "mplfinance>=0.12.10b0",
    "yfinance>=1.2",
    "requests>=2.31",
    "ibapi>=10.30",
    "python-dotenv>=1.0",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: end-to-end backtests on fixtures (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
